name: Auto Publish Articles

on:
  # SUSPENDU temporairement (audit SEO — oct. 2026) : pas de publication automatique.
  # Pour réactiver le calendrier quotidien, décommenter le bloc schedule ci-dessous.
  # schedule:
  #   # Tous les jours à 21h15 UTC
  #   - cron: '15 21 * * *'

  # Exécution manuelle contrôlée uniquement (Actions → Run workflow)
  workflow_dispatch:

permissions:
  contents: write # Nécessaire pour push les changements

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Nécessaire pour git diff
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies (optional)
        run: npm ci || echo "⚠️ npm ci failed, but continuing as script only uses Node.js built-ins"
        continue-on-error: true
      
      - name: Run auto-publish script
        env:
          CI: true
        run: |
          set -e  # Arrêter en cas d'erreur
          echo "📅 Date du jour (UTC): $(date -u +%Y-%m-%d)"
          echo "📅 Date du jour (local): $(date +%Y-%m-%d)"
          echo "📁 Working directory: $(pwd)"
          echo "📁 Listing répertoire racine:"
          ls -la | head -20
          echo "📁 Listing content/blog:"
          ls -la content/blog/ || echo "⚠️ content/blog directory not found"
          echo "📁 Listing content/blog/draft:"
          ls -la content/blog/draft/ || echo "⚠️ content/blog/draft directory not found"
          echo "🔍 Vérification du script..."
          if [ ! -f scripts/auto-publish-articles.js ]; then
            echo "❌ Script introuvable: scripts/auto-publish-articles.js"
            echo "📁 Contenu du dossier scripts:"
            ls -la scripts/ || echo "⚠️ scripts directory not found"
            exit 1
          fi
          echo "✅ Script trouvé, exécution..."
          node scripts/auto-publish-articles.js --debug
          EXIT_CODE=$?
          echo "📊 Script terminé avec le code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Script failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "✅ Script exécuté avec succès"
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code content/blog/ content/blog/draft/ || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/blog/ content/blog/draft/
          git status
          git commit -m "🤖 Auto-publish articles scheduled for $(date +%Y-%m-%d)" || exit 0
          git push origin HEAD:main || git push
      
      - name: No changes
        if: steps.git-check.outputs.has_changes != 'true'
        run: echo "✅ No articles to publish today"
